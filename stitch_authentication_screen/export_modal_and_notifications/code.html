<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Notes - Export</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#197fe6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem", // 8px
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light text-slate-900 dark:bg-background-dark dark:text-slate-100 overflow-hidden h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 bg-white px-10 py-3 dark:border-slate-800 dark:bg-slate-900">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-slate-900 dark:text-white">
<div class="size-8 text-primary">
<svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M39.5563 34.1455V13.8546C39.5563 15.708 36.8773 17.3437 32.7927 18.3189C30.2914 18.916 27.263 19.2655 24 19.2655C20.737 19.2655 17.7086 18.916 15.2073 18.3189C11.1227 17.3437 8.44365 15.708 8.44365 13.8546V34.1455C8.44365 35.9988 11.1227 37.6346 15.2073 38.6098C17.7086 39.2069 20.737 39.5564 24 39.5564C27.263 39.5564 30.2914 39.2069 32.7927 38.6098C36.8773 37.6346 39.5563 35.9988 39.5563 34.1455Z" fill="currentColor"></path>
<path clip-rule="evenodd" d="M10.4485 13.8519C10.4749 13.9271 10.6203 14.246 11.379 14.7361C12.298 15.3298 13.7492 15.9145 15.6717 16.3735C18.0007 16.9296 20.8712 17.2655 24 17.2655C27.1288 17.2655 29.9993 16.9296 32.3283 16.3735C34.2508 15.9145 35.702 15.3298 36.621 14.7361C37.3796 14.246 37.5251 13.9271 37.5515 13.8519C37.5287 13.7876 37.4333 13.5973 37.0635 13.2931C36.5266 12.8516 35.6288 12.3647 34.343 11.9175C31.79 11.0295 28.1333 10.4437 24 10.4437C19.8667 10.4437 16.2099 11.0295 13.657 11.9175C12.3712 12.3647 11.4734 12.8516 10.9365 13.2931C10.5667 13.5973 10.4713 13.7876 10.4485 13.8519ZM37.5563 18.7877C36.3176 19.3925 34.8502 19.8839 33.2571 20.2642C30.5836 20.9025 27.3973 21.2655 24 21.2655C20.6027 21.2655 17.4164 20.9025 14.7429 20.2642C13.1498 19.8839 11.6824 19.3925 10.4436 18.7877V34.1275C10.4515 34.1545 10.5427 34.4867 11.379 35.027C12.298 35.6207 13.7492 36.2054 15.6717 36.6644C18.0007 37.2205 20.8712 37.5564 24 37.5564C27.1288 37.5564 29.9993 37.2205 32.3283 36.6644C34.2508 36.2054 35.702 35.6207 36.621 35.027C37.4573 34.4867 37.5485 34.1546 37.5563 34.1275V18.7877ZM41.5563 13.8546V34.1455C41.5563 36.1078 40.158 37.5042 38.7915 38.3869C37.3498 39.3182 35.4192 40.0389 33.2571 40.5551C30.5836 41.1934 27.3973 41.5564 24 41.5564C20.6027 41.5564 17.4164 41.1934 14.7429 40.5551C12.5808 40.0389 10.6502 39.3182 9.20848 38.3869C7.84205 37.5042 6.44365 36.1078 6.44365 34.1455L6.44365 13.8546C6.44365 12.2684 7.37223 11.0454 8.39581 10.2036C9.43325 9.3505 10.8137 8.67141 12.343 8.13948C15.4203 7.06909 19.5418 6.44366 24 6.44366C28.4582 6.44366 32.5797 7.06909 35.657 8.13948C37.1863 8.67141 38.5667 9.3505 39.6042 10.2036C40.6278 11.0454 41.5563 12.2684 41.5563 13.8546Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">Smart Notes</h2>
</div>
<label class="flex flex-col min-w-40 !h-10 max-w-64">
<div class="flex w-full flex-1 items-stretch rounded-lg h-full bg-slate-100 dark:bg-slate-800">
<div class="text-slate-500 flex border-none items-center justify-center pl-4 rounded-l-lg">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 focus:outline-0 focus:ring-0 border-none bg-transparent focus:border-none h-full placeholder:text-slate-500 px-4 rounded-l-none pl-2 text-sm font-normal leading-normal dark:text-white dark:placeholder:text-slate-400" placeholder="Search" value=""/>
</div>
</label>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="flex items-center gap-6 md:gap-9">
<a class="text-slate-900 text-sm font-medium leading-normal hover:text-primary dark:text-slate-200 dark:hover:text-primary transition-colors" href="#">All Notes</a>
<a class="text-slate-900 text-sm font-medium leading-normal hover:text-primary dark:text-slate-200 dark:hover:text-primary transition-colors" href="#">Favorites</a>
<a class="text-slate-900 text-sm font-medium leading-normal hover:text-primary dark:text-slate-200 dark:hover:text-primary transition-colors" href="#">Trash</a>
</div>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-blue-600 transition-colors shadow-sm">
<span class="truncate">New Note</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border border-slate-200 dark:border-slate-700" data-alt="User profile picture" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCALHmTVl6aqzcLqk0G-id9UL4m8XBikb8yb3vLk8bL1sZn8lR1SGZ-TREkbygOlnGq1VbZl9opkY6air-zb31g3OCIKcGXTq1gyZnqQya5jd4abscRHvZt7p5jGao6vp9l72Ml58PrhwPLkA-AP87WPrWErsa2Ccp8bbxGq6oZAhC1bqEjUzuo8wv2w0hf1On6K4PPIXUeXvE2JTeGgvlLKChHXrB9V-w90Xh6bYESCBgTUPm4MkgPsI1jNSDCQz8VR6wRIKYXkEI");'></div>
</div>
</header>
<!-- Main Content Area (Blurred Background Context) -->
<main class="relative flex-1 flex overflow-hidden">
<!-- Sidebar placeholder for context -->
<aside class="w-64 border-r border-slate-200 bg-white hidden md:flex flex-col p-4 gap-2 dark:bg-slate-900 dark:border-slate-800 opacity-50 pointer-events-none">
<div class="h-8 w-3/4 bg-slate-100 rounded dark:bg-slate-800"></div>
<div class="h-8 w-full bg-slate-100 rounded dark:bg-slate-800"></div>
<div class="h-8 w-5/6 bg-slate-100 rounded dark:bg-slate-800"></div>
<div class="mt-8 h-4 w-1/2 bg-slate-100 rounded dark:bg-slate-800"></div>
<div class="h-8 w-full bg-slate-100 rounded dark:bg-slate-800"></div>
</aside>
<!-- Note Editor placeholder for context -->
<div class="flex-1 p-8 md:p-12 opacity-50 pointer-events-none">
<div class="max-w-3xl mx-auto space-y-6">
<div class="h-12 w-3/4 bg-slate-200 rounded dark:bg-slate-800"></div>
<div class="space-y-3">
<div class="h-4 w-full bg-slate-200 rounded dark:bg-slate-800"></div>
<div class="h-4 w-full bg-slate-200 rounded dark:bg-slate-800"></div>
<div class="h-4 w-5/6 bg-slate-200 rounded dark:bg-slate-800"></div>
</div>
</div>
</div>
<!-- Overlay Backdrop -->
<div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] z-40 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="w-full max-w-[480px] bg-white rounded-xl shadow-2xl dark:bg-slate-900 ring-1 ring-slate-900/5 dark:ring-white/10 flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
<!-- Modal Header -->
<div class="px-6 pt-6 pb-2">
<div class="flex items-center justify-between">
<h2 class="text-slate-900 tracking-tight text-xl font-bold leading-tight dark:text-white">Export Note</h2>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<p class="text-slate-500 text-sm font-normal leading-normal pt-2 dark:text-slate-400">Choose a format to export your note "Project Requirements".</p>
</div>
<!-- Modal Body -->
<div class="flex flex-col gap-3 p-6">
<!-- Option 1: PDF -->
<label class="group relative flex items-start gap-4 rounded-lg border border-solid border-slate-200 p-4 cursor-pointer hover:border-primary/50 hover:bg-primary/5 transition-all dark:border-slate-700 dark:hover:border-primary/50 dark:hover:bg-primary/10">
<div class="flex items-center h-5 mt-0.5">
<input checked="" class="peer h-5 w-5 border-2 border-slate-300 text-primary focus:ring-primary/20 dark:border-slate-600 dark:bg-slate-800 dark:checked:bg-primary" name="export-format" type="radio"/>
</div>
<div class="flex grow flex-col">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">picture_as_pdf</span>
<p class="text-slate-900 text-sm font-semibold leading-normal dark:text-white">PDF Document</p>
</div>
<p class="text-slate-500 text-sm font-normal leading-normal dark:text-slate-400">Best for sharing, printing, and archiving. Preserves formatting.</p>
</div>
<!-- Active State Ring (via CSS peer) -->
<div class="absolute inset-0 rounded-lg border-2 border-primary opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></div>
</label>
<!-- Option 2: Markdown -->
<label class="group relative flex items-start gap-4 rounded-lg border border-solid border-slate-200 p-4 cursor-pointer hover:border-primary/50 hover:bg-primary/5 transition-all dark:border-slate-700 dark:hover:border-primary/50 dark:hover:bg-primary/10">
<div class="flex items-center h-5 mt-0.5">
<input class="peer h-5 w-5 border-2 border-slate-300 text-primary focus:ring-primary/20 dark:border-slate-600 dark:bg-slate-800 dark:checked:bg-primary" name="export-format" type="radio"/>
</div>
<div class="flex grow flex-col">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">markdown</span>
<p class="text-slate-900 text-sm font-semibold leading-normal dark:text-white">Markdown File</p>
</div>
<p class="text-slate-500 text-sm font-normal leading-normal dark:text-slate-400">Plain text with lightweight formatting. Best for use in other editors.</p>
</div>
<!-- Active State Ring (via CSS peer) -->
<div class="absolute inset-0 rounded-lg border-2 border-primary opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></div>
</label>
</div>
<!-- Modal Footer -->
<div class="flex items-center justify-end gap-3 px-6 py-4 bg-slate-50 border-t border-slate-100 dark:bg-slate-800/50 dark:border-slate-800">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-white border border-slate-200 text-slate-700 text-sm font-bold shadow-sm hover:bg-slate-50 hover:text-slate-900 transition-colors dark:bg-transparent dark:border-transparent dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800">
                        Cancel
                    </button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-6 bg-primary text-white text-sm font-bold shadow-sm hover:bg-blue-600 transition-all focus:ring-2 focus:ring-primary/20 focus:ring-offset-2 dark:focus:ring-offset-slate-900">
                        Download
                    </button>
</div>
</div>
</div>
<!-- Success Toast Notification -->
<!-- Placed absolutely to simulate a toast appearing -->
<div class="absolute bottom-8 right-8 z-50 animate-[slide-in-up_0.5s_ease-out]">
<div class="flex items-center gap-3 p-4 bg-slate-900 text-white rounded-lg shadow-lg border border-slate-700 dark:bg-white dark:text-slate-900 dark:border-slate-200">
<div class="flex items-center justify-center w-6 h-6 rounded-full bg-green-500 text-white dark:bg-green-600">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<div class="flex flex-col">
<span class="text-sm font-medium">Export Complete</span>
<span class="text-xs text-slate-400 dark:text-slate-500">Note exported successfully.</span>
</div>
<button class="ml-4 text-slate-400 hover:text-white dark:hover:text-slate-700">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
</main>
<style>
        @keyframes slide-in-up {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</body></html>
