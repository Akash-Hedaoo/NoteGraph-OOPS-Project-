<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Authentication Screen - CloudNotes</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#197fe6",
                "background-light": "#f6f7f8",
                "background-dark": "#111921",
                },
                fontFamily: {
                "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Navbar -->
<header class="w-full border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#1a2632] px-6 py-4 flex items-center justify-between shadow-sm relative z-10">
<div class="flex items-center gap-3">
<div class="w-8 h-8 text-primary">
<svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_319)">
<path d="M8.57829 8.57829C5.52816 11.6284 3.451 15.5145 2.60947 19.7452C1.76794 23.9758 2.19984 28.361 3.85056 32.3462C5.50128 36.3314 8.29667 39.7376 11.8832 42.134C15.4698 44.5305 19.6865 45.8096 24 45.8096C28.3135 45.8096 32.5302 44.5305 36.1168 42.134C39.7033 39.7375 42.4987 36.3314 44.1494 32.3462C45.8002 28.361 46.2321 23.9758 45.3905 19.7452C44.549 15.5145 42.4718 11.6284 39.4217 8.57829L24 24L8.57829 8.57829Z" fill="currentColor"></path>
</g>
<defs>
<clippath id="clip0_6_319"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">CloudNotes</h1>
</div>
<div class="flex items-center gap-4">
<button class="hidden sm:flex text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium text-sm transition-colors">
                Help Center
            </button>
<div class="h-4 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>
<button class="text-sm font-bold text-slate-900 dark:text-white hover:text-primary transition-colors">
                Contact Support
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-background-light dark:bg-background-dark">
<div class="w-full max-w-md">
<!-- Auth Card -->
<div class="bg-white dark:bg-[#1a2632] rounded-lg shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
<!-- Card Header -->
<div class="p-8 pb-6 text-center">
<h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white mb-2">Welcome Back</h2>
<p class="text-slate-500 dark:text-slate-400">Sign in to sync your notes across devices</p>
</div>
<!-- Form -->
<form class="px-8 pb-8 space-y-5">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-200" for="email">
                            Email
                        </label>
<div class="relative">
<input class="w-full h-12 px-4 bg-slate-50 dark:bg-[#111921] border border-slate-300 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" placeholder="name@company.com" type="email"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-200" for="password">
                                Password
                            </label>
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">
                                Forgot password?
                            </a>
</div>
<div class="relative">
<input class="w-full h-12 px-4 pr-12 bg-slate-50 dark:bg-[#111921] border border-red-500 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all" id="password" placeholder="Enter your password" type="password" value="wrongpassword123"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Error Message Example -->
<div class="flex items-center gap-1.5 mt-2 text-red-600 dark:text-red-400 animate-pulse">
<span class="material-symbols-outlined text-[18px]">error</span>
<p class="text-sm font-medium">Invalid email or password. Please try again.</p>
</div>
</div>
<!-- Actions -->
<div class="pt-2 space-y-4">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 dark:text-slate-500 text-sm font-medium">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="h-11 flex items-center justify-center gap-2 bg-slate-50 dark:bg-[#111921] hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 font-medium transition-colors" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                                Google
                            </button>
<button class="h-11 flex items-center justify-center gap-2 bg-slate-50 dark:bg-[#111921] hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 font-medium transition-colors" type="button">
<svg class="w-5 h-5 text-slate-900 dark:text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.024 6.839 9.345.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.02 22 16.42 22 12c0-5.523-4.477-10-10-10z"></path>
</svg>
                                GitHub
                            </button>
</div>
</div>
</form>
<!-- Footer of Card -->
<div class="px-8 py-4 bg-slate-50 dark:bg-[#15202b] border-t border-slate-200 dark:border-slate-800 text-center">
<p class="text-sm text-slate-600 dark:text-slate-400">
                        Don't have an account? 
                        <a class="font-bold text-primary hover:text-primary/80 transition-colors ml-1" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Additional Help -->
<div class="mt-8 text-center space-x-6 text-sm text-slate-500 dark:text-slate-400">
<a class="hover:text-slate-800 dark:hover:text-slate-200 transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-slate-800 dark:hover:text-slate-200 transition-colors" href="#">Terms of Service</a>
</div>
</div>
</main>
</body></html>
